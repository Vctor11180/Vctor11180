<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" fill="none">
  <defs>
    <linearGradient id="grad-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="tele-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .pulse-dot { animation: pulseDot 2s infinite ease-in-out; }
    .scanline { stroke-dasharray: 6 8; animation: scan 3s linear infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes scan { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .pulse-dot, .scanline { animation: none; } }
  </style>

  <!-- Container Base -->
  <rect width="880" height="210" rx="16" fill="#05070d"/>
  <rect width="880" height="210" rx="16" fill="url(#tele-grid)"/>
  <rect x="0.5" y="0.5" width="879" height="209" rx="15.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Header Bar -->
  <g transform="translate(24, 20)">
    <circle class="pulse-dot" cx="6" cy="6" r="4" fill="#10b981"/>
    <text x="18" y="9.5" fill="#10b981" font-size="10.5" letter-spacing="2" class="mono">NODE HEALTH: OPTIMAL</text>
    <text x="210" y="9.5" fill="#6b7489" font-size="10.5" letter-spacing="1" class="mono">| PIPELINE STATUS: ACTIVE</text>
    <text x="832" y="9.5" fill="#a3adc2" font-size="9.5" text-anchor="end" letter-spacing="1.5" class="mono">SYS_TICK // LATAM_REGION</text>
  </g>

  <!-- Divider with Corner Decors -->
  <line x1="24" y1="42" x2="856" y2="42" stroke="#ffffff" stroke-opacity="0.06"/>
  <line class="scanline" x1="24" y1="42" x2="856" y2="42" stroke="#00f2fe" stroke-opacity="0.35"/>

  <!-- Metric Card 1: Protocols / Web3 -->
  <g transform="translate(24, 56)">
    <rect width="198" height="134" rx="10" fill="#0a0e19" stroke="#a855f7" stroke-opacity="0.3"/>
    <path d="M0 10V0H10" stroke="#a855f7" stroke-width="1.2" transform="translate(-0.5 -0.5)"/>
    <text x="14" y="24" fill="#6b7489" font-size="9" letter-spacing="1.5" class="mono">CHAIN CORES</text>
    <text x="14" y="54" fill="#e6ebf5" font-size="22" font-weight="700" class="mono">4 ECOSYSTEMS</text>
    <text x="14" y="74" fill="#c084fc" font-size="10" class="mono">EVM · Soroban · Avax · Sol</text>
    <rect x="14" y="94" width="170" height="4" rx="2" fill="#161b2c"/>
    <rect x="14" y="94" width="150" height="4" rx="2" fill="url(#grad-purple)"/>
    <text x="14" y="118" fill="#a3adc2" font-size="9" class="mono">Smart Contracts · Foundry</text>
  </g>

  <!-- Metric Card 2: Distributed Core / Web2 -->
  <g transform="translate(232, 56)">
    <rect width="198" height="134" rx="10" fill="#0a0e19" stroke="#00f2fe" stroke-opacity="0.25"/>
    <path d="M0 10V0H10" stroke="#00f2fe" stroke-width="1.2" transform="translate(-0.5 -0.5)"/>
    <text x="14" y="24" fill="#6b7489" font-size="9" letter-spacing="1.5" class="mono">INFRA &amp; BACKEND</text>
    <text x="14" y="54" fill="#e6ebf5" font-size="22" font-weight="700" class="mono">HEXAGONAL</text>
    <text x="14" y="74" fill="#00f2fe" font-size="10" class="mono">Node · .NET Core · Laravel</text>
    <rect x="14" y="94" width="170" height="4" rx="2" fill="#161b2c"/>
    <rect x="14" y="94" width="162" height="4" rx="2" fill="url(#grad-cyan)"/>
    <text x="14" y="118" fill="#a3adc2" font-size="9" class="mono">PostgreSQL · Docker · AWS</text>
  </g>

  <!-- Metric Card 3: Hackathons & Bounties -->
  <g transform="translate(440, 56)">
    <rect width="198" height="134" rx="10" fill="#0a0e19" stroke="#10b981" stroke-opacity="0.3"/>
    <path d="M0 10V0H10" stroke="#10b981" stroke-width="1.2" transform="translate(-0.5 -0.5)"/>
    <text x="14" y="24" fill="#6b7489" font-size="9" letter-spacing="1.5" class="mono">SPRINT VELOCITY</text>
    <text x="14" y="54" fill="#e6ebf5" font-size="22" font-weight="700" class="mono">10+ BUILDS</text>
    <text x="14" y="74" fill="#10b981" font-size="10" class="mono">ETH Bolivia · Aleph · Stellar</text>
    <rect x="14" y="94" width="170" height="4" rx="2" fill="#161b2c"/>
    <rect x="14" y="94" width="144" height="4" rx="2" fill="url(#grad-green)"/>
    <text x="14" y="118" fill="#a3adc2" font-size="9" class="mono">Sub-48h MVP to Production</text>
  </g>

  <!-- Metric Card 4: Security & Primitives -->
  <g transform="translate(648, 56)">
    <rect width="198" height="134" rx="10" fill="#0a0e19" stroke="#38bdf8" stroke-opacity="0.3"/>
    <path d="M0 10V0H10" stroke="#38bdf8" stroke-width="1.2" transform="translate(-0.5 -0.5)"/>
    <text x="14" y="24" fill="#6b7489" font-size="9" letter-spacing="1.5" class="mono">SECURITY &amp; IDENTITY</text>
    <text x="14" y="54" fill="#e6ebf5" font-size="22" font-weight="700" class="mono">zkTLS + NFC</text>
    <text x="14" y="74" fill="#38bdf8" font-size="10" class="mono">ERC-2771 · Tether WDK</text>
    <rect x="14" y="94" width="170" height="4" rx="2" fill="#161b2c"/>
    <rect x="14" y="94" width="158" height="4" rx="2" fill="url(#grad-blue)"/>
    <text x="14" y="118" fill="#a3adc2" font-size="9" class="mono">Zero-Trust · Deterministic</text>
  </g>
</svg>

