<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <pattern id="hud-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 242, 254, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
    }
  </style>

  <!-- Base Card Frame -->
  <rect width="880" height="320" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="880" height="320" rx="12" fill="url(#hud-grid)" />

  <!-- Corner Tech Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 868 28 L 868 12 L 852 12" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 12 292 L 12 308 L 28 308" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 868 292 L 868 308 L 852 308" stroke="#00f2fe" stroke-width="2" fill="none" />

  <!-- Header Section -->
  <g transform="translate(25, 24)">
    <!-- Terminal Title -->
    <text x="0" y="16" fill="#00f2fe" font-size="11" font-weight="700" letter-spacing="2" class="mono">
      SYSTEM TELEMETRY // SYS_ID: VCTOR-11180
    </text>
    <text x="310" y="16" fill="#64748b" font-size="11" class="mono">| PROTOCOL: ARCHITECT_RUNNER_v4.2</text>

    <!-- Status Badge -->
    <g transform="translate(710, 2)">
      <rect width="120" height="22" rx="4" fill="#062820" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#10b981" class="pulse-dot" />
      <text x="26" y="15" fill="#34d399" font-size="10" font-weight="700" letter-spacing="1" class="mono">NODE: ONLINE</text>
    </g>
    
    <!-- Top divider line -->
    <line x1="0" y1="28" x2="830" y2="28" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="28" x2="160" y2="28" stroke="#00f2fe" stroke-width="1.5" />
  </g>

  <!-- Telemetry Panels (3 Columns) -->
  
  <!-- Column 1: Decentralized & Web3 Protocols -->
  <g transform="translate(25, 78)">
    <rect width="265" height="175" rx="8" fill="rgba(15, 23, 42, 0.65)" stroke="#1e293b" stroke-width="1" />
    <path d="M 12 0 L 70 0" stroke="#00f2fe" stroke-width="2" />
    
    <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">LAYER 01 // WEB3 &amp; CORE</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11" class="sans">Consensus &amp; Smart Contracts</text>

    <g transform="translate(16, 62)" font-size="11" class="mono">
      <text x="0" y="12" fill="#e2e8f0"><tspan fill="#00f2fe">▸</tspan> Soroban / Stellar (Rust)</text>
      <text x="0" y="32" fill="#e2e8f0"><tspan fill="#00f2fe">▸</tspan> EVM / Solidity &amp; Foundry</text>
      <text x="0" y="52" fill="#e2e8f0"><tspan fill="#00f2fe">▸</tspan> AMM, Hooks &amp; DeFi Liquidity</text>
      <text x="0" y="72" fill="#e2e8f0"><tspan fill="#00f2fe">▸</tspan> Tether WDK &amp; P2P Escrow</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="233" height="12" rx="3" fill="#0f172a" />
      <rect width="210" height="12" rx="3" fill="url(#cyan-glow)" />
      <text x="80" y="10" fill="#04121d" font-size="8.5" font-weight="800" class="mono">EFFICIENCY: 94.8%</text>
    </g>
  </g>

  <!-- Column 2: Backend & Distributed Architecture -->
  <g transform="translate(307, 78)">
    <rect width="265" height="175" rx="8" fill="rgba(15, 23, 42, 0.65)" stroke="#1e293b" stroke-width="1" />
    <path d="M 12 0 L 70 0" stroke="#10b981" stroke-width="2" />

    <text x="16" y="24" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">LAYER 02 // DISTRIBUTED SYS</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11" class="sans">Microservices &amp; Databases</text>

    <g transform="translate(16, 62)" font-size="11" class="mono">
      <text x="0" y="12" fill="#e2e8f0"><tspan fill="#10b981">▸</tspan> Node.js, Express &amp; REST/gRPC</text>
      <text x="0" y="32" fill="#e2e8f0"><tspan fill="#10b981">▸</tspan> C# .NET Core &amp; PHP Laravel</text>
      <text x="0" y="52" fill="#e2e8f0"><tspan fill="#10b981">▸</tspan> Relational SQL &amp; DynamoDB</text>
      <text x="0" y="72" fill="#e2e8f0"><tspan fill="#10b981">▸</tspan> Docker &amp; Serverless Lambda</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="233" height="12" rx="3" fill="#0f172a" />
      <rect width="220" height="12" rx="3" fill="url(#emerald-glow)" />
      <text x="76" y="10" fill="#021f14" font-size="8.5" font-weight="800" class="mono">STABILITY: 99.4%</text>
    </g>
  </g>

  <!-- Column 3: Frontend & Reactive Systems -->
  <g transform="translate(590, 78)">
    <rect width="265" height="175" rx="8" fill="rgba(15, 23, 42, 0.65)" stroke="#1e293b" stroke-width="1" />
    <path d="M 12 0 L 70 0" stroke="#a855f7" stroke-width="2" />

    <text x="16" y="24" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">LAYER 03 // CLIENT INTERFACES</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11" class="sans">Full-Stack UX &amp; dApp Engines</text>

    <g transform="translate(16, 62)" font-size="11" class="mono">
      <text x="0" y="12" fill="#e2e8f0"><tspan fill="#c084fc">▸</tspan> Next.js (App Router) &amp; SSR</text>
      <text x="0" y="32" fill="#e2e8f0"><tspan fill="#c084fc">▸</tspan> React &amp; TypeScript Ecosystem</text>
      <text x="0" y="52" fill="#e2e8f0"><tspan fill="#c084fc">▸</tspan> Tailwind CSS Design Systems</text>
      <text x="0" y="72" fill="#e2e8f0"><tspan fill="#c084fc">▸</tspan> Viem, Wagmi &amp; Stellar SDK</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="233" height="12" rx="3" fill="#0f172a" />
      <rect width="215" height="12" rx="3" fill="url(#purple-glow)" />
      <text x="76" y="10" fill="#1b082e" font-size="8.5" font-weight="800" class="mono">RESPONSIVE: 98.2%</text>
    </g>
  </g>

  <!-- Bottom Diagnostic Footer Bar -->
  <g transform="translate(25, 275)">
    <line x1="0" y1="0" x2="830" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="18" fill="#64748b" font-size="10" class="mono">TARGET_DOMAINS: [DEFI, HIGH-THROUGHPUT ARCHITECTURES, DISTRIBUTED LEDGERS, REAL-WORLD ASSETS]</text>
    <text x="730" y="18" fill="#38bdf8" font-size="10" font-weight="700" class="mono">LOC: BOLIVIA // LATAM</text>
  </g>
</svg>
